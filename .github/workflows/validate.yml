name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node scripts/build.mjs
      - run: node --check dist/dyson-cleaning-planner-card.js
      - run: git diff --exit-code -- dist/
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin
