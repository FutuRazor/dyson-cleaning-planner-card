<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
<title id="title">Dyson Cleaning Planner</title>
<desc id="desc">Three coloured rooms numbered in cleaning order and a fourth neutral room with a selected blue zone. Room one at bottom left has completed cyan cleaning lanes. In room two at top left, the robot starts a purple lane. The zone measures 55 by 70 centimetres.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171e23"/><stop offset="1" stop-color="#23333c"/></linearGradient>
  <radialGradient id="beam" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="46"><stop offset=".40" stop-color="#39ff14" stop-opacity=".85"/><stop offset=".62" stop-color="#65ff39" stop-opacity=".55"/><stop offset=".85" stop-color="#65ff39" stop-opacity=".18"/><stop offset="1" stop-color="#65ff39" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-35%" y="-20%" width="170%" height="150%"><feGaussianBlur stdDeviation="1.2"/></filter>
</defs>
<rect x="1" y="1" width="1098" height="298" rx="22" fill="url(#bg)" stroke="#45545d" stroke-width="2"/>
<!-- Illustrative floor plan: independent of the user's actual home. -->
<g transform="translate(32 30)">
  <rect x="8" y="8" width="140" height="106" rx="9" fill="#423a26" stroke="#a38a48" stroke-width="1.5"/>
  <rect x="158" y="8" width="140" height="106" rx="9" fill="#393049" stroke="#8f77ae" stroke-width="1.5"/>
  <rect x="8" y="124" width="140" height="106" rx="9" fill="#173f47" stroke="#358f9b" stroke-width="1.5"/>
  <rect x="158" y="124" width="140" height="106" rx="9" fill="#252c31" stroke="#59656d" stroke-width="1.5"/>
  <!-- Completed room 1: evenly spaced lanes with rounded turnaround bends. -->
  <path d="M26 166H128A8 8 0 0 1 128 182H28A8 8 0 0 0 28 198H128A8 8 0 0 1 128 214H26"
        fill="none" stroke="#23cadd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Room 2: the robot is beginning its first straight lane in another path colour. -->
  <path d="M105 101V68" fill="none" stroke="#b39ae8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="105" cy="101" r="2.5" fill="#dfd3f8"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="30" cy="146" r="14" fill="#22c9d9"/><text x="30" y="151.5" fill="#10282e">1</text>
    <circle cx="30" cy="30" r="14" fill="#ecbd60"/><text x="30" y="35.5" fill="#30291b">2</text>
    <circle cx="180" cy="30" r="14" fill="#b29adc"/><text x="180" y="35.5" fill="#262037">3</text>
  </g>
  <!-- Same body proportions and forward light as the card header illustration. -->
  <g transform="translate(105 68)">
    <path d="M0 0L-23-40Q0-52 23-40Z" fill="url(#beam)" filter="url(#soft)"/>
    <circle cy="1" r="22" fill="#000" opacity=".18"/>
    <circle r="21" fill="#3a3a40" stroke="#e7e9ed" stroke-width="1.5"/>
    <circle r="18" fill="#45454e"/>
    <path d="M-18.2-10.5A21 21 0 0 1 18.2-10.5" fill="none" stroke="#b39ae8" stroke-width="4"/>
    <circle cy="-8" r="6" fill="#c8c8cd"/><circle cy="-8" r="2.6" fill="#39ff14"/>
  </g>
  <!-- Neutral room with a partial zone and the card's floating dimension pill. -->
  <rect x="204" y="156" width="44" height="56" fill="#00b9dc" fill-opacity=".20" stroke="#27d4ec" stroke-width="2"/>
  <rect x="184" y="130" width="84" height="20" rx="10" fill="#142329" fill-opacity=".96"/>
  <text x="226" y="144" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#f2f7f9">55 &#215; 70 cm</text>
  <circle cx="248" cy="212" r="10" fill="#119bb8" stroke="#eefbff" stroke-width="1.7"/>
  <path d="M244 208L252 216M246 216H252V210" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<path d="M355 43V257" stroke="#4f626c" stroke-opacity=".5"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="390" y="74" fill="#70dbe5" font-size="14" font-weight="700" letter-spacing="2.6">YOUR ROOMS. YOUR ZONE. YOUR PLAN.</text>
  <text x="387" y="133" fill="#f2f7f9" font-size="43" font-weight="700" letter-spacing="-.8">Dyson Cleaning Planner</text>
  <text x="390" y="176" fill="#b9c8d0" font-size="22">A dashboard card for Home Assistant</text>
  <path d="M390 207H1060" stroke="#4f626c" stroke-opacity=".5"/>
  <text x="390" y="239" fill="#b9c8d0" font-size="17">Room &amp; zone planning</text>
  <circle cx="594" cy="233" r="2" fill="#22c9d9"/>
  <text x="611" y="239" fill="#b9c8d0" font-size="17">Live map</text>
  <circle cx="700" cy="233" r="2" fill="#22c9d9"/>
  <text x="717" y="239" fill="#b9c8d0" font-size="17">Dock controls</text>
</g>
</svg>
