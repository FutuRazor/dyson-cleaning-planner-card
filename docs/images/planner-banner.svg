<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="title desc">
  <title id="title">Dyson Cleaning Planner</title>
  <desc id="desc">A dashboard card for Home Assistant. A robot follows a cyan cleaning path through three numbered rooms.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#171e23"/>
      <stop offset="1" stop-color="#23333c"/>
    </linearGradient>
    <linearGradient id="robot" x2="0" y2="1">
      <stop stop-color="#32d6e3"/>
      <stop offset="1" stop-color="#00a6c2"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1098" height="278" rx="22" fill="url(#background)" stroke="#45545d" stroke-width="2"/>
  <!-- Room geometry and the planned route are independent of any real floor plan. -->
  <g transform="translate(35 31)">
    <path d="M10 10H135V102H10Z" fill="#173940" stroke="#35838d" stroke-width="2"/>
    <path d="M145 10H270V102H145Z" fill="#38352a" stroke="#786b43" stroke-width="2"/>
    <path d="M10 112H270V208H10Z" fill="#302f40" stroke="#64607d" stroke-width="2"/>
    <path d="M70 54H108V138H239V157H108V177H195" fill="none" stroke="#23cadb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
      <circle cx="32" cy="32" r="15" fill="#22c9d9"/><text x="32" y="38" fill="#10282e">1</text>
      <circle cx="167" cy="32" r="15" fill="#ecbd60"/><text x="167" y="38" fill="#30291b">2</text>
      <circle cx="32" cy="134" r="15" fill="#b29adc"/><text x="32" y="140" fill="#262037">3</text>
    </g>
    <g transform="translate(77 67)">
      <circle r="35" fill="#102b33" stroke="#3ad7e4" stroke-opacity=".2" stroke-width="10"/>
      <circle r="30" fill="url(#robot)" stroke="#84e9ef" stroke-width="2"/>
      <path d="M-26-11Q0-24 26-11M-25 15Q0 26 25 15" fill="none" stroke="#10353e" stroke-width="3"/>
      <circle cy="-10" r="8" fill="#163b44" stroke="#81e7ec" stroke-width="2"/>
      <path d="M-7 9H7" stroke="#10353e" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="195" cy="177" r="5" fill="#d1f6f8"/>
  </g>
  <path d="M338 43V237" stroke="#4f626c" stroke-opacity=".5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="374" y="77" fill="#70dbe5" font-size="15" font-weight="700" letter-spacing="3">ROOM BY ROOM. YOUR WAY.</text>
    <text x="371" y="137" fill="#f2f7f9" font-size="44" font-weight="700" letter-spacing="-.8">Dyson Cleaning Planner</text>
    <text x="374" y="180" fill="#b9c8d0" font-size="23">A dashboard card for Home Assistant</text>
    <path d="M374 208H420" stroke="#22c9d9" stroke-width="3" stroke-linecap="round"/>
    <text x="434" y="214" fill="#a4bac5" font-size="17">Plan rooms. Follow the clean.</text>
  </g>
</svg>
