<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dyson Cleaning Planner · Preview</title><style>
body{margin:0;background:#f1f4f6;color:#20272d;font-family:Arial,sans-serif;padding:28px 16px}main{max-width:580px;margin:auto}.demo{font-size:13px;line-height:1.6;margin:0 0 18px;color:#52616e}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button{padding:10px 14px;background:white;border:1px solid #ccd5db;border-radius:8px;cursor:pointer}body.dark{background:#14181d;color:#e9eef2;--primary-text-color:#e9eef2;--secondary-text-color:#abb8c4;--card-background-color:#20252b;--secondary-background-color:#292f36;--divider-color:#414953;--primary-color:#73d5f5;--text-primary-color:#09232e}.dark .demo{color:#abb8c4}#editor{margin-top:24px;padding:18px;border:1px solid #aaa;border-radius:14px}#log{white-space:pre-wrap;font-size:12px;overflow-wrap:anywhere}ha-icon::before{content:'◉';font-size:26px}
</style></head><body><main><p class="demo">Interactive preview with simulated Home Assistant entities and a sample map. No robot connected.</p><div class="toolbar"><button id="theme">Light / Dark</button><button id="settings">Card editor</button><button id="offline">Toggle availability</button><button id="external">External clean</button><button id="docked">Docked</button><button data-phase="WASHING_MOP">Wash roller</button><button data-phase="DRYING_MOP">Dry roller</button><button data-phase="COLLECTING_DUST">Empty dust bin</button><button data-mode="VACUUMING">Vacuuming</button><button data-mode="MOPPING">Mopping</button></div><dyson-cleaning-planner-card id="card"></dyson-cleaning-planner-card><div id="editor" hidden></div><pre id="log"></pre></main><script type="module">
import '../preview/ha-switch-preview.js';
import '../dist/dyson-cleaning-planner-card.js';
import { batchFixture, addStationFixture } from '../tests/fixture.mjs';
// Stand-in for Home Assistant's icon element, only used by this offline preview.
customElements.define('ha-icon', class extends HTMLElement {
  connectedCallback() {
    this.attachShadow({ mode: 'open' }).innerHTML = '<style>:host{display:inline-flex;width:24px;height:24px}svg{width:24px;height:24px}</style><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M4 9h16M7 18h10"/><circle cx="12" cy="6" r="1"/><path d="M10 13h4"/></svg>';
  }
});
const darkHintStyle = document.createElement('style');
darkHintStyle.textContent = 'body.dark{--warning-color:#f2b45d}';
document.head.append(darkHintStyle);
const f = addStationFixture(batchFixture());
// Consumables match the integration's sensor contract; no robot is contacted.
for (const [i, type] of ['brushBar', 'mopRoller', 'sideBrushes', 'robotFilter', 'dockFilter', 'cleaningSolution'].entries()) {
 const id = `sensor.demo_consumable_${i}`;
 f.registry.push({ entity_id: id, platform: 'dyson_spot_scrub', device_id: 'demo-device', unique_id: `DEMO_consumable_${i}` });
 f.hass.states[id] = { state: i === 5 ? 'ok' : String([4, 6, 9, 80, 95][i]), attributes: { consumable_type: type, value_kind: i === 5 ? 'refill_status' : 'usage_percent' } };
}
// Map the mock HA camera-proxy URL to the bundled sample SVG. On GitHub Pages,
// resolve it relative to this preview page; on the local preview server, use
// its /preview/ route. The production card still uses HA's real camera proxy.
f.hass.hassUrl = picture => {
 if (!picture.startsWith('/api/camera_proxy/')) return picture;
 return location.pathname.endsWith('/preview/index.html')
   ? new URL('./map.svg', location.href).href
   : new URL('/preview/map.svg', location.origin).href;
};
const card = document.querySelector('#card');
card.setConfig({ type: 'custom:dyson-cleaning-planner-card', entity: f.entity });
card.hass = f.hass;
window.demo = { ...f, card };
f.hass.services.dyson_spot_scrub.cancel_drying = {};
const original = f.hass.callService;
f.hass.callService = async (...args) => {
 await new Promise(r => setTimeout(r, 80)); await original(...args);
 if (args[0] === 'dyson_spot_scrub' && args[1] === 'cancel_drying') f.hass.states[f.entity].attributes.dock_state = 'IDLE';
 if (args[1] === 'start_rooms_with_settings') f.hass.states[f.entity].state = 'cleaning';
 if (args[0] === 'vacuum' && args[1] === 'return_to_base') f.hass.states[f.entity].state = 'returning';
 if (args[0] === 'vacuum' && args[1] === 'pause') f.hass.states[f.entity].state = 'paused';
 if (args[0] === 'vacuum' && args[1] === 'start') f.hass.states[f.entity].state = 'cleaning';
 card.hass = { ...f.hass }; document.querySelector('#log').textContent = JSON.stringify(f.calls, null, 2);
};
document.querySelector('#theme').onclick = () => document.body.classList.toggle('dark');
document.querySelector('#offline').onclick = () => { f.hass.states[f.entity].state = f.hass.states[f.entity].state === 'docked' ? 'unavailable' : 'docked'; card.hass = { ...f.hass }; };
document.querySelector('#external').onclick = () => { f.hass.states[f.entity].attributes.dock_state = 'IDLE'; f.hass.states[f.entity].state = 'cleaning'; card.hass = { ...f.hass }; };
document.querySelector('#docked').onclick = () => { f.hass.states[f.entity].attributes.dock_state = 'IDLE'; f.hass.states[f.entity].state = 'docked'; card.hass = { ...f.hass }; };
document.querySelectorAll('[data-phase]').forEach(button => button.onclick = () => {
 f.hass.states[f.entity].state = 'docked';
 f.hass.states[f.entity].attributes.dock_state = button.dataset.phase;
 if (button.dataset.phase === 'DRYING_MOP') Object.assign(f.hass.states[f.entity].attributes, { drying_total_seconds: 14400, drying_remaining_seconds: 6000, drying_updated_at: new Date().toISOString() });
 card.hass = { ...f.hass };
});
document.querySelectorAll('[data-mode]').forEach(button => button.onclick = () => {
 f.hass.states[f.entity].state = 'cleaning';
 Object.assign(f.hass.states[f.entity].attributes, { dock_state: 'IDLE', full_clean_action: button.dataset.mode });
 card.hass = { ...f.hass };
});
document.querySelector('#settings').onclick = () => {
 const host = document.querySelector('#editor'); host.hidden = !host.hidden;
 if (!host.firstChild) { const editor = document.createElement('dyson-cleaning-planner-card-editor'); editor.setConfig(card.config); editor.hass = f.hass; editor.addEventListener('config-changed', e => card.setConfig(e.detail.config)); host.append(editor); }
};
</script></body></html>
